<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Android Updates - Delta</title>

<style>
body {
  background-color: #0b0e14;
  color: white;
  font-family: 'Segoe UI', Arial, sans-serif;
  margin: 0;
  overflow: hidden;
}
.main-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid #30363d;
  border-radius: 15px;
  width: 90%;
  max-width: 900px;
  padding: 40px;
  margin: 100px auto;
  text-align: center;
  position: relative;
  z-index: 2;
}
.btn-dl {
  background: #007bff;
  color: white;
  padding: 12px 35px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: bold;
  display: inline-block;
  margin-top: 20px;
}
canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 1;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="main-card">
  <h1 id="nome">Arquivo</h1>
  <a id="download" class="btn-dl" href="#">Download</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAx-jIvw9lqykjroKMWzRTEOlZ41Xk6-bY",
  databaseURL: "https://vortexxxxxxxxx-5159f-default-rtdb.firebaseio.com",
  projectId: "vortexxxxxxxxx-5159f"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const id = new URLSearchParams(location.search).get("id");
const linkRef = ref(db, "links/" + id);

const snap = await get(linkRef);
const data = snap.val();

document.getElementById("nome").innerText = data.name;
const btn = document.getElementById("download");
btn.href = data.url;

btn.onclick = () => {
  update(linkRef, { clicks: (data.clicks || 0) + 1 });
};
</script>

<script>
// ❄️ SNOW VERMELHO + LINHA BRANCA
const c = document.getElementById("bg");
const ctx = c.getContext("2d");
c.width = innerWidth;
c.height = innerHeight;

let p = [...Array(120)].map(() => ({
  x: Math.random() * c.width,
  y: Math.random() * c.height
}));

function draw() {
  ctx.clearRect(0,0,c.width,c.height);
  p.forEach(a => {
    a.y += 1;
    if (a.y > c.height) a.y = 0;
    ctx.fillStyle = "red";
    ctx.fillRect(a.x,a.y,2,2);
    ctx.strokeStyle = "white";
    ctx.beginPath();
    ctx.moveTo(a.x,a.y);
    ctx.lineTo(a.x+6,a.y+6);
    ctx.stroke();
  });
  requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
