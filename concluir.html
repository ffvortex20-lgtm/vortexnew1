<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Android Updates</title>

<style>
body{
    margin:0;
    color:white;
    font-family:Arial;
    background:#0b0e14;
    overflow:hidden
}
canvas{
    position:fixed;
    inset:0;
    z-index:-1
}
.main{
    max-width:900px;
    margin:80px auto;
    background:rgba(255,255,255,.03);
    border:1px solid #30363d;
    border-radius:15px;
    padding:40px
}
.file-box{
    background:#0d1117;
    border:1px solid #30363d;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px
}
.info{
    display:flex;
    align-items:center
}
.info img{
    width:50px;
    height:50px;
    object-fit:cover;
    border-radius:8px;
    margin-right:15px
}
.btn{
    background:#007bff;
    color:white;
    padding:12px 30px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    border:none
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="main">
    <h2 id="title">Download</h2>

    <div class="file-box">
        <div class="info">
            <img id="icon" src="">
            <div>
                <b id="fname"></b><br>
                <small id="fsize"></small>
            </div>
        </div>
        <button class="btn" onclick="download()">Download</button>
    </div>
</div>

<script>
const fileData = sessionStorage.getItem("fileData");
const fileName = sessionStorage.getItem("fileName");
const fileSize = sessionStorage.getItem("fileSize");
const title = sessionStorage.getItem("title");
const photo = sessionStorage.getItem("photoData");

document.getElementById("title").innerText = title || "Download Disponível";
document.getElementById("fname").innerText = fileName;
document.getElementById("fsize").innerText = fileSize;
document.getElementById("icon").src = photo || "https://upload.wikimedia.org/wikipedia/commons/d/d7/Android_robot.svg";

function download(){
    const a = document.createElement("a");
    a.href = fileData;
    a.download = fileName;
    a.click();
}

/* PARTICULAS SNOW VERMELHO + LINHAS BRANCAS */
const c = document.getElementById("bg");
const ctx = c.getContext("2d");
c.width = innerWidth;
c.height = innerHeight;

let p = Array.from({length:80},()=>({
    x:Math.random()*c.width,
    y:Math.random()*c.height,
    r:Math.random()*3+1,
    vy:Math.random()+0.5
}));

function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    p.forEach(e=>{
        ctx.fillStyle="red";
        ctx.beginPath();
        ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
        ctx.fill();
        e.y+=e.vy;
        if(e.y>c.height)e.y=0;
    });

    for(let i=0;i<p.length;i++){
        for(let j=i+1;j<p.length;j++){
            let d=Math.hypot(p[i].x-p[j].x,p[i].y-p[j].y);
            if(d<120){
                ctx.strokeStyle="rgba(255,255,255,.15)";
                ctx.beginPath();
                ctx.moveTo(p[i].x,p[i].y);
                ctx.lineTo(p[j].x,p[j].y);
                ctx.stroke();
            }
        }
    }
    requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
