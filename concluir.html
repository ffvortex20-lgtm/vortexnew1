<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vortex Links • Concluir</title>

<style>
/* ===== RESET ===== */
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}

/* ===== BODY ===== */
body{
  background:radial-gradient(circle at top,#6a00ff,#12001f);
  min-height:100vh;
  color:#fff
}

/* ===== LAYOUT ===== */
.container{
  max-width:800px;
  margin:60px auto;
  background:rgba(0,0,0,.55);
  border-radius:16px;
  padding:30px;
  box-shadow:0 0 30px #9b4dff
}

h1{
  text-align:center;
  margin-bottom:20px;
  color:#d6b3ff;
  text-shadow:0 0 10px #a855ff
}

.box{
  background:rgba(20,0,40,.8);
  border-radius:14px;
  padding:20px;
  box-shadow:0 0 15px #7a2bff;
  text-align:center
}

/* ===== VIDEO ===== */
.videoBox{
  margin-top:10px;
  border-radius:12px;
  overflow:hidden;
  background:#000
}
.videoBox iframe,
.videoBox video{
  width:100%;
  height:300px;
  border:none
}

/* ===== INFO ===== */
.timer{font-size:18px;margin:15px 0;color:#ffd6ff}
.result{
  word-break:break-all;
  background:#140022;
  padding:12px;
  border-radius:10px;
  border:1px dashed #9b4dff;
  margin-bottom:15px
}
.error{
  color:#ffb3c1;
  margin-top:10px;
  display:none
}

/* ===== BUTTONS ===== */
button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:10px;
  border:none;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  color:#fff;
  background:linear-gradient(45deg,#8f3bff,#c77dff);
  box-shadow:0 0 15px #9b4dff;
  display:none
}

/* ===== FOOTER ===== */
.footer{
  text-align:center;
  margin-top:15px;
  font-size:14px;
  color:#e0ccff
}
</style>
</head>
<body>

<div class="container">
<h1>DESBLOQUEANDO LINK</h1>

<div class="box">
  <div class="videoBox" id="videoBox"></div>
  <div class="timer">Aguarde <span id="t">5</span>s...</div>
  <div class="result" id="res"></div>
  <div class="error" id="err">Link inválido ou inexistente.</div>
  <button id="subscribe">🔔 Visitar canal</button>
  <button id="baixar">⬇️ Baixar</button>
</div>

<div class="footer">
  Cliques: <span id="c">0</span> • Criador: <span id="dono">-</span> • dev: vortex
</div>
</div>

<!-- ===== FIREBASE ===== -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyAx-jIvw9lqykjroKMWzRTEOlZ41Xk6-bY",
  databaseURL: "https://vortexxxxxxxxx-5159f-default-rtdb.firebaseio.com",
  projectId: "vortexxxxxxxxx-5159f"
});

const db = firebase.database();

const t = document.getElementById('t');
const c = document.getElementById('c');
const baixar = document.getElementById('baixar');
const sub = document.getElementById('subscribe');
const dono = document.getElementById('dono');
const res = document.getElementById('res');
const box = document.getElementById('videoBox');
const err = document.getElementById('err');

/* ========= PEGAR ID ========= */
let id = location.hash.slice(1);

if (!id) {
  err.style.display = 'block';
  err.textContent = 'Link inválido ou inexistente.';
} else {
  carregarLink(id);
}

function carregarLink(id){
  const ref = db.ref('links/' + id);

  ref.once('value').then(snap=>{
    if(!snap.exists()){
      err.style.display = 'block';
      err.textContent = 'Link removido ou inexistente.';
      return;
    }

    const data = snap.val();

    dono.textContent = data.n || 'Vortex';
    res.textContent = location.origin + location.pathname + '#' + id;

    if(data.v) carregarVideo(data.v);

    if(data.c){
      sub.style.display = 'block';
      sub.onclick = () => window.open(data.c,'_blank');
    }

    ref.child('clicks').on('value', s=>{
      c.textContent = s.val() || 0;
    });

    iniciarTimer(ref, data.l);
  });
}

/* ========= VIDEO ========= */
function carregarVideo(v){
  if(v.includes('youtube') || v.includes('youtu.be')){
    let vid = v.includes('v=')
      ? v.split('v=')[1].split('&')[0]
      : v.split('youtu.be/')[1];

    box.innerHTML = `
      <iframe src="https://www.youtube.com/embed/${vid}?autoplay=1&mute=1"
      allow="autoplay" allowfullscreen></iframe>`;
  } else {
    box.innerHTML = `<video src="${v}" controls autoplay muted></video>`;
  }
}

/* ========= TIMER ========= */
function iniciarTimer(ref, link){
  let time = 5;
  const timer = setInterval(()=>{
    t.textContent = time;
    time--;

    if(time < 0){
      clearInterval(timer);

      if(link){
        baixar.style.display = 'block';
        baixar.onclick = ()=>{
          ref.child('clicks').transaction(v => (v||0)+1);
          window.location.href = link.startsWith('http') ? link : 'https://' + link;
        };
      }
    }
  },1000);
}
</script>
