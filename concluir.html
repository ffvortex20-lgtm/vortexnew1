<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vortex Links • Concluir</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{background:radial-gradient(circle at top,#6a00ff,#12001f);min-height:200vh;color:#fff}
.container{max-width:800px;margin:60px auto;background:rgba(0,0,0,.55);border-radius:16px;padding:30px;box-shadow:0 0 30px #9b4dff}
h1{text-align:center;margin-bottom:20px;color:#d6b3ff;text-shadow:0 0 10px #a855ff}
.box{background:rgba(20,0,40,.8);border-radius:14px;padding:20px;box-shadow:0 0 15px #7a2bff;text-align:center}
.videoBox{margin-top:10px;border-radius:12px;overflow:hidden;background:#000}
.videoBox iframe,.videoBox video{width:100%;height:300px;border:none}
.timer{font-size:18px;margin:15px 0;color:#ffd6ff}
.result{word-break:break-all;background:#140022;padding:12px;border-radius:10px;border:1px dashed #9b4dff;margin-bottom:15px}
button{width:100%;padding:14px;margin-top:10px;border-radius:10px;border:none;font-size:15px;font-weight:bold;cursor:pointer;color:#fff;background:linear-gradient(45deg,#8f3bff,#c77dff);box-shadow:0 0 15px #9b4dff;display:none}
.footer{text-align:center;margin-top:15px;font-size:14px;color:#e0ccff}
.stats{margin-top:8px;font-size:13px;color:#cdb8ff}
.error{margin-top:10px;color:#ff9aa2;font-size:14px;display:none}
</style>
</head>
<body>
<div class="container">
<h1>DESBLOQUEANDO LINK</h1>
<div class="box">
  <div class="videoBox" id="videoBox"></div>
  <div class="timer">Aguarde <span id="t">5</span>s...</div>
  <div class="result" id="res"></div>
  <div class="error" id="err">Link, canal ou ID inválido.</div>
  <button id="subscribe">🔔 Inscrever-se</button>
  <button id="baixar">⬇️ Baixar</button>
</div>
<div class="footer">
  Cliques reais: <span id="c">0</span>
  <div class="stats">Online agora: <span id="on">0</span> • dev: vortex</div>
</div>
</div>

<!-- FIREBASE v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
/* ===== FIREBASE CONFIG ===== */
firebase.initializeApp({
  apiKey: "AIzaSyAx-jIvw9lqykjroKMWzRTEOlZ41Xk6-bY",
  databaseURL: "https://vortexxxxxxxxx-5159f-default-rtdb.firebaseio.com",
  projectId: "vortexxxxxxxxx-5159f"
});
const db = firebase.database();

/* ===== UTIL ===== */
const $ = id => document.getElementById(id);

function normalizeURL(raw){
  if(!raw) return null;
  const v = raw.trim();
  if(!v) return null;
  if(/^https?:\/\//i.test(v)) return v;
  if(/^[\w-]+(\.[\w-]+)+/.test(v)) return 'https://' + v;
  return null;
}

/* ===== PEGAR ID DA URL ===== */
const linkID = location.hash ? location.hash.substring(1) : '';
if(!linkID){
  $('err').style.display='block';
  $('res').textContent = 'ID não informado. Gere o link novamente.';
} else {
  $('res').textContent = location.href;

  /* ===== BUSCAR DADOS NO FIREBASE ===== */
  db.ref('links/'+linkID).once('value').then(snap=>{
    const data = snap.val();
    if(!data){
      $('err').style.display='block';
      return;
    }

    const safeLink  = normalizeURL(data.l);
    const safeCanal = normalizeURL(data.c);

    /* ===== CONTADORES ===== */
    const clicksRef = db.ref('links/'+linkID+'/clicks');
    const onlineRef = db.ref('online/'+linkID);
    const mySession = onlineRef.push(true);
    mySession.onDisconnect().remove();

    clicksRef.on('value', s => $('c').textContent = s.val() || 0);
    onlineRef.on('value', s => $('on').textContent = s.numChildren());

    /* ===== VÍDEO ===== */
    if(data.v){
      if(data.v.includes('youtube') || data.v.includes('youtu.be')){
        const id = data.v.includes('v=') ? data.v.split('v=')[1].split('&')[0] : data.v.split('youtu.be/')[1].split('?')[0];
        $('videoBox').innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&mute=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
      } else {
        $('videoBox').innerHTML = `<video src="${data.v}" autoplay muted loop controls></video>`;
      }
    }

    /* ===== TIMER ===== */
    let time = 5;
    const baixar = $('baixar');
    const sub = $('subscribe');
    const err = $('err');

    const timer = setInterval(()=>{
      $('t').textContent = --time;
      if(time<=0){
        clearInterval(timer);
        if(safeLink) baixar.style.display='block';
        if(safeCanal) sub.style.display='block';
        if(!safeLink && !safeCanal) err.style.display='block';
      }
    },1000);

    /* ===== BOTÕES ===== */
    sub.onclick = ()=>{
      if(!safeCanal){ err.style.display='block'; return; }
      window.open(safeCanal,'_blank');
    };

    baixar.onclick = ()=>{
      if(!safeLink){ err.style.display='block'; return; }
      clicksRef.transaction(v => (v||0)+1);
      window.location.href = safeLink;
    };
  });
}
</script>
</body>
</html>
