<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Download</title>

<style>
body{margin:0;background:#0b0e14;color:white;font-family:Arial}
.main{max-width:800px;margin:80px auto;padding:30px;
background:rgba(255,255,255,.04);
border:1px solid #30363d;border-radius:15px}
.box{display:flex;justify-content:space-between;align-items:center;
background:#0d1117;border:1px solid #30363d;
padding:20px;border-radius:12px}
img{width:60px;height:60px;border-radius:10px;object-fit:cover}
button{background:#007bff;color:white;padding:12px 30px;
border:none;border-radius:8px;font-weight:bold;cursor:pointer}
</style>
</head>

<body>
<div class="main">
<h2 id="title"></h2>

<div class="box">
 <div style="display:flex;align-items:center">
  <img id="icon">
  <div style="margin-left:15px">
   <b id="name"></b><br>
   <small id="size"></small>
  </div>
 </div>
 <button onclick="baixar()">Download</button>
</div>
</div>

<script type="module">
import { db } from "./firebase.js";
import { ref,get,update } from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const id=new URLSearchParams(location.search).get("id");
const r=ref(db,"links/"+id);
const s=await get(r);
if(!s.exists())alert("Link inválido");

const d=s.val();
document.getElementById("title").innerText=d.title;
document.getElementById("name").innerText="Arquivo disponível";
document.getElementById("size").innerText="";
document.getElementById("icon").src=
 d.photoUrl || "https://upload.wikimedia.org/wikipedia/commons/d/d7/Android_robot.svg";

window.baixar=async()=>{
 await update(r,{clicks:(d.clicks||0)+1});
 location.href=d.fileUrl;
};
</script>
</body>
</html>
