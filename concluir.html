<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vortex Links • Concluir</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:radial-gradient(circle at top,#6a00ff,#12001f);min-height:100vh;color:#fff}
.container{max-width:800px;margin:60px auto;background:rgba(0,0,0,.55);border-radius:16px;padding:30px}
.box{background:#140022;border-radius:14px;padding:20px;text-align:center}
.videoBox{margin:10px 0;border-radius:12px;overflow:hidden;background:#000}
.videoBox iframe,.videoBox video{width:100%;height:300px}
.timer{margin:15px 0;color:#ffd6ff}
button{width:100%;padding:14px;margin-top:10px;border-radius:10px;border:none;font-weight:bold;
background:linear-gradient(45deg,#8f3bff,#c77dff);color:#fff;cursor:pointer;display:none}
.footer{text-align:center;margin-top:15px;font-size:14px;color:#ccc}
</style>
</head>

<body>
<div class="container">
<h2 style="text-align:center">DESBLOQUEANDO LINK</h2>
<p id="creatorName" style="text-align:center"></p>
<p id="device" style="text-align:center;font-size:13px;color:#aaa"></p>

<div class="box">
  <div class="videoBox" id="videoBox"></div>
  <div class="timer">Aguarde <span id="t">5</span>s</div>
  <div id="res"></div>
  <button id="subscribe">🔔 Inscrever-se</button>
  <button id="baixar">⬇️ Baixar</button>
</div>

<div class="footer">Cliques: <span id="c">0</span> • dev: vortex</div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyAx-jIvw9lqykjroKMWzRTEOlZ41Xk6-bY",
  databaseURL: "https://vortexxxxxxxxx-5159f-default-rtdb.firebaseio.com",
  projectId: "vortexxxxxxxxx-5159f"
});

const id = location.hash.replace("#","");
const ref = firebase.database().ref("links/" + id);

ref.on("value", snap => {
  if(!snap.exists()) return;

  const d = snap.val();
  creatorName.textContent = "Criador: " + d.n;
  device.textContent = /Android|iPhone/i.test(navigator.userAgent) ? "📱 Celular" : "💻 Computador";
  c.textContent = d.clicks;

  if(d.v && !videoBox.innerHTML){
    if(d.v.includes("youtu")){
      const vid = d.v.includes("v=") ? d.v.split("v=")[1].split("&")[0] : d.v.split("youtu.be/")[1];
      videoBox.innerHTML = `<iframe src="https://www.youtube.com/embed/${vid}?autoplay=1&mute=1"></iframe>`;
    }else{
      videoBox.innerHTML = `<video src="${d.v}" autoplay muted loop controls></video>`;
    }
  }

  let time = 5;
  const it = setInterval(()=>{
    t.textContent = --time;
    if(time<=0){
      clearInterval(it);
      baixar.style.display = "block";
      if(d.c) subscribe.style.display = "block";
    }
  },1000);

  baixar.onclick = () => {
    ref.child("clicks").transaction(v => (v||0)+1);
    location.href = d.l.startsWith("http") ? d.l : "https://" + d.l;
  };

  subscribe.onclick = () => d.c && window.open(d.c,"_blank");
});
</script>
</body>
</html>
