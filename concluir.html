<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vortex Links • Concluir</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:radial-gradient(circle at top,#6a00ff,#12001f);min-height:100vh;color:#fff}
.container{max-width:800px;margin:60px auto;background:rgba(0,0,0,.55);
border-radius:16px;padding:30px;box-shadow:0 0 30px #9b4dff}
h2{text-align:center;color:#d6b3ff}
.box{background:#140022;border-radius:14px;padding:20px;text-align:center}
.videoBox{margin:10px 0;border-radius:12px;overflow:hidden;background:#000}
.videoBox iframe,.videoBox video{width:100%;height:300px;border:none}
.timer{margin:15px 0;color:#ffd6ff;font-size:18px}
button{width:100%;padding:14px;margin-top:10px;border-radius:10px;border:none;
font-weight:bold;background:linear-gradient(45deg,#8f3bff,#c77dff);
color:#fff;cursor:pointer;display:none}
.footer{text-align:center;margin-top:15px;font-size:14px;color:#ccc}
</style>
</head>

<body>
<div class="container">
<h2>DESBLOQUEANDO LINK</h2>

<p id="creatorName" style="text-align:center"></p>
<p id="device" style="text-align:center;font-size:13px;color:#aaa"></p>

<div class="box">
  <div class="videoBox" id="videoBox"></div>
  <div class="timer">Aguarde <span id="t">5</span>s...</div>
  <div id="res"></div>

  <button id="subscribe">🔔 Inscrever-se</button>
  <button id="baixar">⬇️ Baixar</button>
</div>

<div class="footer">
  Cliques: <span id="c">0</span> • dev: vortex
</div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
/* ===== FIREBASE INIT ===== */
firebase.initializeApp({
  apiKey: "AIzaSyAx-jIvw9lqykjroKMWzRTEOlZ41Xk6-bY",
  databaseURL: "https://vortexxxxxxxxx-5159f-default-rtdb.firebaseio.com",
  projectId: "vortexxxxxxxxx-5159f"
});

/* ===== ELEMENTOS ===== */
const videoBox = document.getElementById("videoBox");
const baixar = document.getElementById("baixar");
const subscribe = document.getElementById("subscribe");
const t = document.getElementById("t");
const c = document.getElementById("c");
const res = document.getElementById("res");
const creatorName = document.getElementById("creatorName");
const device = document.getElementById("device");

/* ===== DEVICE ===== */
device.textContent =
  /Android|iPhone|iPad/i.test(navigator.userAgent)
  ? "📱 Celular"
  : "💻 Computador";

/* ===== ID DO LINK ===== */
const id = location.hash.replace("#","");
if(!id){
  res.textContent = "❌ Link inválido";
  throw new Error("Sem ID");
}

const ref = firebase.database().ref("links/" + id);

/* ===== BUSCAR DADOS ===== */
let dados = null;

ref.once("value").then(snap=>{
  if(!snap.exists()){
    res.textContent = "❌ Link não encontrado";
    return;
  }

  dados = snap.val();

  creatorName.textContent = "Criador: " + dados.n;
  res.textContent = location.href;

  /* ===== VÍDEO ===== */
  if(dados.v){
    if(dados.v.includes("youtu")){
      const vid = dados.v.includes("v=")
        ? dados.v.split("v=")[1].split("&")[0]
        : dados.v.split("youtu.be/")[1];

      videoBox.innerHTML =
        `<iframe src="https://www.youtube.com/embed/${vid}?autoplay=1&mute=1"
         allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
    }else{
      videoBox.innerHTML =
        `<video src="${dados.v}" autoplay muted loop controls></video>`;
    }
  }

  /* ===== TIMER (SEMPRE FUNCIONA) ===== */
  let time = 5;
  const timer = setInterval(()=>{
    t.textContent = --time;
    if(time <= 0){
      clearInterval(timer);
      baixar.style.display = "block";
      if(dados.c) subscribe.style.display = "block";
    }
  },1000);
});

/* ===== CONTADOR REALTIME ===== */
ref.child("clicks").on("value", snap=>{
  c.textContent = snap.val() || 0;
});

/* ===== BOTÕES ===== */
baixar.onclick = ()=>{
  if(!dados) return;
  ref.child("clicks").transaction(v => (v || 0) + 1);
  location.href = dados.l.startsWith("http")
    ? dados.l
    : "https://" + dados.l;
};

subscribe.onclick = ()=>{
  if(dados && dados.c) window.open(dados.c,"_blank");
};
</script>
</body>
</html>
