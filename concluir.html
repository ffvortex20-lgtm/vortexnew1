<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Android Updates</title>
    <style>
        body { background-color: #0b0e14; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; text-align: center; }
        .header { padding: 50px 0; }
        .home-btn { background: #007bff; color: white; padding: 8px 25px; border-radius: 20px; text-decoration: none; font-weight: bold; }
        h1 { font-size: 3rem; margin-top: 20px; }
        
        .download-box { 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 15px; 
            width: 80%; 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 40px;
        }

        .latest-text { font-size: 1.5rem; font-weight: bold; margin-bottom: 30px; display: block; }

        .file-info-bar {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            padding: 20px;
            justify-content: space-between;
            text-align: left;
        }

        .file-details { display: flex; align-items: center; }
        .icon { width: 40px; margin-right: 15px; }
        .file-name { font-weight: bold; display: block; color: #fff; }
        .file-meta { font-size: 0.8rem; color: #8b949e; }

        .btn-download {
            background: #007bff;
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-download:hover { background: #0056b3; }
    </style>
</head>
<body>

    <div class="header">
        <a href="#" class="home-btn">Home</a>
        <h1>Android Updates</h1>
    </div>

    <div class="download-box">
        <span class="latest-text" id="displayTitulo">Latest Android Version</span>

        <div class="file-info-bar">
            <div class="file-details">
                <img src="https://cdn-icons-png.flaticon.com/512/226/226770.png" class="icon" alt="Android Icon">
                <div>
                    <span class="file-name" id="displayNome">Delta-2.702.622.apk</span>
                    <span class="file-meta">Size: <span id="displayTamanho">0 MB</span></span><br>
                    <span class="file-meta">Modified: <span id="displayData">--</span></span>
                </div>
            </div>
            <a href="#" class="btn-download" id="linkDownload">Download</a>
        </div>
    </div>

    <script>
        // Preenche os dados automaticamente ao carregar a página
        document.getElementById('displayNome').innerText = localStorage.getItem('nomeArquivo') || "Arquivo não encontrado";
        document.getElementById('displayTamanho').innerText = localStorage.getItem('tamanhoArquivo') || "0 MB";
        document.getElementById('displayTitulo').innerText = localStorage.getItem('tituloPersonalizado') || "Latest Android Version";
        document.getElementById('displayData').innerText = localStorage.getItem('dataModificado') || "---";

        // Simulação de download
        document.getElementById('linkDownload').onclick = function() {
            alert("Iniciando download de: " + localStorage.getItem('nomeArquivo'));
        };
    </script>
</body>
</html>
