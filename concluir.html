<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Android Updates - Delta</title>

<style>
body {
  background-color: #0b0e14;
  color: white;
  font-family: 'Segoe UI', Arial, sans-serif;
  margin: 0;
  overflow: hidden;
}
.nav-home {
  background: #007bff;
  padding: 8px 25px;
  border-radius: 20px;
  margin: 40px auto;
  width: max-content;
  font-weight: bold;
}
h1 {
  font-size: 50px;
  margin: 20px 0 40px;
  text-align: center;
}
.main-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid #30363d;
  border-radius: 15px;
  width: 90%;
  max-width: 900px;
  padding: 40px;
  margin: auto;
  text-align: center;
  position: relative;
  z-index: 2;
}
.filename {
  font-size: 20px;
  font-weight: bold;
  color: #58a6ff;
}
.btn-dl {
  background: #007bff;
  color: white;
  padding: 12px 35px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: bold;
  display: inline-block;
  margin-top: 25px;
}
canvas {
  position: fixed;
  inset: 0;
  z-index: 1;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="nav-home">Home</div>
<h1>Android Updates</h1>

<div class="main-card">
  <div id="displayTitle">Latest Android Version</div>
  <p class="filename" id="displayFile">arquivo.apk</p>
  <p>Size: <span id="displaySize">0 MB</span></p>
  <a id="dlLink" class="btn-dl" href="#">Download</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* 🔥 SUA FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyAx-jIvw9lqykjroKMWzRTEOlZ41Xk6-bY",
  databaseURL: "https://vortexxxxxxxxx-5159f-default-rtdb.firebaseio.com",
  projectId: "vortexxxxxxxxx-5159f"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const id = new URLSearchParams(location.search).get("id");
const snap = await get(ref(db, "links/" + id));
const d = snap.val();

document.getElementById("displayTitle").innerText = d.title;
document.getElementById("displayFile").innerText = d.name;
document.getElementById("displaySize").innerText = d.size;

const btn = document.getElementById("dlLink");
btn.href = d.name;
btn.setAttribute("download", d.name);

btn.onclick = () => {
  update(ref(db, "links/" + id), {
    clicks: (d.clicks || 0) + 1
  });
};
</script>

<script>
// ❄️ SNOW VERMELHO + LINHA BRANCA
const c = document.getElementById("bg");
const x = c.getContext("2d");
c.width = innerWidth;
c.height = innerHeight;

let p = [...Array(120)].map(() => ({
  x: Math.random() * c.width,
  y: Math.random() * c.height
}));

function draw() {
  x.clearRect(0,0,c.width,c.height);
  p.forEach(a => {
    a.y += 1;
    if (a.y > c.height) a.y = 0;
    x.fillStyle = "red";
    x.fillRect(a.x,a.y,2,2);
    x.strokeStyle = "white";
    x.beginPath();
    x.moveTo(a.x,a.y);
    x.lineTo(a.x+6,a.y+6);
    x.stroke();
  });
  requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
