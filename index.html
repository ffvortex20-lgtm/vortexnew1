<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Vortex Links</title>
<style>
body{background:#0d1117;color:#fff;font-family:Arial;padding:20px}
.box{background:#161b22;padding:20px;border-radius:10px;max-width:420px}
input,button{width:100%;margin-top:10px;padding:10px}
.card{background:#21262d;padding:10px;margin-top:10px;border-radius:8px}
</style>
</head>
<body>

<div class="box">
  <h3>Gerar Link</h3>
  <input type="file" id="file">
  <button id="btn">GERAR LINK</button>
</div>

<h3>Links Gerados</h3>
<div id="lista"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, set, onValue, remove } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getStorage, ref as sRef, uploadBytes, getDownloadURL } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

/* 🔥 SUA FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyAx-jIvw9lqykjroKMWzRTEOlZ41Xk6-bY",
  databaseURL: "https://vortexxxxxxxxx-5159f-default-rtdb.firebaseio.com",
  projectId: "vortexxxxxxxxx-5159f",
  storageBucket: "vortexxxxxxxxx-5159f.firebasestorage.app"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const storage = getStorage(app);

const btn = document.getElementById("btn");
const lista = document.getElementById("lista");

btn.onclick = async () => {
  const file = document.getElementById("file").files[0];
  if (!file) return alert("Selecione um arquivo");

  const fileRef = sRef(storage, "files/" + Date.now() + "_" + file.name);
  await uploadBytes(fileRef, file);
  const url = await getDownloadURL(fileRef);

  const linkRef = push(ref(db, "links"));
  await set(linkRef, {
    name: file.name,
    url: url,
    clicks: 0
  });

  alert("✅ LINK GERADO COM SUCESSO");
};

onValue(ref(db, "links"), snap => {
  lista.innerHTML = "";
  snap.forEach(c => {
    const d = c.val();
    lista.innerHTML += `
      <div class="card">
        <b>${d.name}</b><br>
        Cliques: ${d.clicks}<br>
        <a href="concluir.html?id=${c.key}" target="_blank">Abrir</a>
        <button onclick="remover('${c.key}')">Remover</button>
      </div>
    `;
  });
});

window.remover = id => {
  remove(ref(db, "links/" + id));
};
</script>

</body>
</html>
