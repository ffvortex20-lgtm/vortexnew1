<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Gerador de Links</title>
    <style>
        body { background-color: #0b0e14; color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #161b22; padding: 30px; border-radius: 12px; border: 1px solid #30363d; width: 450px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #58a6ff; margin-bottom: 20px; }
        label { font-size: 12px; color: #8b949e; display: block; margin-top: 10px; }
        input { width: 100%; padding: 12px; margin-top: 5px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 15px; margin-top: 20px; border-radius: 6px; border: none; background: #238636; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #2ea043; }
        #resultado { margin-top: 20px; display: none; padding: 15px; background: #0d1117; border: 1px dashed #58a6ff; border-radius: 6px; }
        #linkFinal { color: #58a6ff; font-size: 14px; word-break: break-all; margin: 10px 0; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Gerar Link Direto</h2>
        
        <label>Título da Versão</label>
        <input type="text" id="tit" placeholder="Ex: Delta V702">
        
        <label>Nome do Arquivo</label>
        <input type="text" id="nom" placeholder="Ex: delta_v2.apk">
        
        <label>Tamanho</label>
        <input type="text" id="tam" placeholder="Ex: 1.5 GB">
        
        <label>Link de Download (2GB+)</label>
        <input type="url" id="l_d" placeholder="https://mediafire.com/...">

        <label>Link do Canal</label>
        <input type="url" id="l_c" placeholder="https://youtube.com/@seu_canal">

        <label>Link do Vídeo</label>
        <input type="url" id="l_v" placeholder="Link do vídeo do YT">

        <button onclick="gerarLinkCurto()">GERAR LINK PARA DOWNLOAD</button>

        <div id="resultado">
            <label>Link Gerado (Vai para Concluir):</label>
            <strong id="linkFinal"></strong>
            <button onclick="copiarLink()" style="background: #1f6feb;">COPIAR LINK</button>
        </div>
    </div>

    <script>
        async function gerarLinkCurto() {
            // Garante que o link aponte para concluir.html independente de onde você esteja
            let urlAtual = window.location.href.split('?')[0];
            let pastaBase = urlAtual.substring(0, urlAtual.lastIndexOf('/') + 1);
            let linkConcluir = pastaBase + "concluir.html";

            const params = new URLSearchParams({
                t: document.getElementById('tit').value,
                n: document.getElementById('nom').value,
                s: document.getElementById('tam').value,
                d: document.getElementById('l_d').value,
                c: document.getElementById('l_c').value,
                v: document.getElementById('l_v').value.split('v=')[1] || document.getElementById('l_v').value.split('/').pop()
            });

            const linkLongoComDados = `${linkConcluir}?${params.toString()}`;
            
            try {
                // Chama o encurtador passando o link da página CONCLUIR
                const res = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(linkLongoComDados)}`);
                const linkCurto = await res.text();
                
                if(linkCurto.startsWith("http")) {
                    document.getElementById('linkFinal').innerText = linkCurto;
                } else {
                    document.getElementById('linkFinal').innerText = linkLongoComDados;
                }
                
                document.getElementById('resultado').style.display = 'block';
            } catch (err) {
                // Se o encurtador falhar, mostra o link longo (que já aponta para concluir.html)
                document.getElementById('linkFinal').innerText = linkLongoComDados;
                document.getElementById('resultado').style.display = 'block';
            }
        }

        function copiarLink() {
            const texto = document.getElementById('linkFinal').innerText;
            navigator.clipboard.writeText(texto);
            alert("Link copiado! Pode divulgar.");
        }
    </script>
</body>
</html>
