<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Configurar Download</title>

<style>
body {
  background: #0d1117;
  color: white;
  font-family: sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}
.box {
  background: #161b22;
  padding: 25px;
  border-radius: 10px;
  border: 1px solid #30363d;
  width: 320px;
}
input, button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 5px;
}
button {
  background: #238636;
  color: white;
  border: none;
  cursor: pointer;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="box">
  <h3>Configurar Página</h3>

  <input type="file" id="file">
  <button id="gerar">Ir para Página de Download</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

/* 🔥 SUA FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyAx-jIvw9lqykjroKMWzRTEOlZ41Xk6-bY",
  databaseURL: "https://vortexxxxxxxxx-5159f-default-rtdb.firebaseio.com",
  projectId: "vortexxxxxxxxx-5159f",
  storageBucket: "vortexxxxxxxxx-5159f.firebasestorage.app"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const storage = getStorage(app);

document.getElementById("gerar").onclick = async () => {
  const file = document.getElementById("file").files[0];
  if (!file) {
    alert("Selecione um arquivo");
    return;
  }

  // UPLOAD
  const storageRef = sRef(storage, "files/" + Date.now() + "_" + file.name);
  await uploadBytes(storageRef, file);
  const url = await getDownloadURL(storageRef);

  // GERA LINK ÚNICO
  const linkRef = push(ref(db, "links"));
  await set(linkRef, {
    name: file.name,
    url: url,
    clicks: 0,
    createdAt: Date.now()
  });

  // VAI PARA CONCLUIR
  window.location.href = "concluir.html?id=" + linkRef.key;
};
</script>

</body>
</html>
