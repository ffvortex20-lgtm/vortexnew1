<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Vortex Links</title>
<style>
body{background:#0d1117;color:#fff;font-family:Arial;padding:20px}
.box{background:#161b22;padding:20px;border-radius:10px;max-width:400px}
input,button{width:100%;margin-top:10px;padding:10px}
.card{background:#21262d;padding:10px;margin-top:10px;border-radius:8px}
</style>
</head>
<body>

<div class="box">
  <h3>Gerar Link</h3>
  <input type="file" id="file">
  <button onclick="gerar()">GERAR LINK</button>
</div>

<h3>Links Criados</h3>
<div id="lista"></div>

<script type="module">
import "./firebase.js";
import { db, storage } from "./firebase.js";
import {
  ref, push, set, onValue, remove
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import {
  ref as sRef, uploadBytes, getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const lista = document.getElementById("lista");

window.gerar = async () => {
  const file = document.getElementById("file").files[0];
  if (!file) return alert("Selecione um arquivo");

  const fileRef = sRef(storage, "files/" + Date.now() + "_" + file.name);
  await uploadBytes(fileRef, file);
  const url = await getDownloadURL(fileRef);

  const linkRef = push(ref(db, "links"));
  await set(linkRef, {
    name: file.name,
    url,
    clicks: 0
  });

  alert("LINK GERADO!");
};

onValue(ref(db, "links"), snap => {
  lista.innerHTML = "";
  snap.forEach(c => {
    const d = c.val();
    lista.innerHTML += `
      <div class="card">
        <b>${d.name}</b><br>
        Cliques: ${d.clicks}<br>
        <a href="concluir.html?id=${c.key}" target="_blank">Abrir</a>
        <button onclick="remover('${c.key}')">Remover</button>
      </div>
    `;
  });
});

window.remover = id => {
  remove(ref(db, "links/" + id));
};
</script>

</body>
</html>
