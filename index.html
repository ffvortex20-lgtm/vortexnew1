<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Configurar Download</title>
    <style>
        body { background-color: #0b0e14; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #161b22; padding: 30px; border-radius: 10px; border: 1px solid #30363d; width: 400px; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #30363d; background: #0d1117; color: white; }
        button { background: #238636; cursor: pointer; font-weight: bold; border: none; }
        button:hover { background: #2ea043; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Configurar Atualização</h2>
        <input type="text" id="inputTitulo" placeholder="Nome para o título (ex: Delta V702)">
        <input type="file" id="inputFile" accept=".apk,.zip,.rar">
        <button onclick="salvarDados()">Gerar Página de Download</button>
    </div>

    <script>
        function salvarDados() {
            const titulo = document.getElementById('inputTitulo').value;
            const arquivo = document.getElementById('inputFile').files[0];

            if (!titulo || !arquivo) {
                alert("Preencha o nome e selecione um arquivo!");
                return;
            }

            // Salva as informações no navegador
            localStorage.setItem('nomeArquivo', arquivo.name);
            localStorage.setItem('tamanhoArquivo', (arquivo.size / (1024 * 1024)).toFixed(2) + " MB");
            localStorage.setItem('tituloPersonalizado', titulo);
            localStorage.setItem('dataModificado', new Date().toLocaleDateString('pt-BR', { month: 'long', day: 'numeric', year: 'numeric' }));

            // Redireciona para a página de conclusão
            window.location.href = "concluir.html";
        }
    </script>
</body>
</html>
