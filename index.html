<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Vortex • Painel</title>

<style>
body{margin:0;background:#0d1117;color:white;font-family:Arial}
.box{max-width:900px;margin:40px auto;padding:20px}
.card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:20px;margin-bottom:20px}
input,button{width:100%;padding:10px;margin:6px 0;border-radius:6px;border:1px solid #30363d;background:#0d1117;color:white}
button{background:#238636;border:none;font-weight:bold;cursor:pointer}
button:hover{background:#2ea043}
.link{border:1px solid #30363d;padding:10px;border-radius:6px;margin-top:10px}
small{color:#8b949e}
</style>
</head>

<body>
<div class="box">

<div class="card">
<h2>Gerar Novo Link</h2>
<input id="title" placeholder="Título">
<input id="file" type="file">
<input id="photo" type="file" accept="image/*">
<button onclick="gerar()">Gerar Link</button>
</div>

<div class="card">
<h2>Links Gerados</h2>
<div id="lista"></div>
</div>

</div>

<script type="module">
import { db, storage } from "./firebase.js";
import {
 ref as dbRef, push, set, onValue, remove, update
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import {
 ref as stRef, uploadBytes, getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

window.gerar = async ()=>{
 const title=document.getElementById("title").value;
 const file=document.getElementById("file").files[0];
 const photo=document.getElementById("photo").files[0];
 if(!file)return alert("Selecione o arquivo");

 const fRef=stRef(storage,"files/"+Date.now()+"_"+file.name);
 await uploadBytes(fRef,file);
 const fileUrl=await getDownloadURL(fRef);

 let photoUrl="";
 if(photo){
  const pRef=stRef(storage,"photos/"+Date.now()+"_"+photo.name);
  await uploadBytes(pRef,photo);
  photoUrl=await getDownloadURL(pRef);
 }

 const lRef=push(dbRef(db,"links"));
 await set(lRef,{
  title,fileUrl,photoUrl,clicks:0,createdAt:Date.now()
 });

 document.getElementById("title").value="";
 document.getElementById("file").value="";
 document.getElementById("photo").value="";
};

onValue(dbRef(db,"links"),snap=>{
 const lista=document.getElementById("lista");
 lista.innerHTML="";
 snap.forEach(c=>{
  const d=c.val();
  lista.innerHTML+=`
   <div class="link">
    <b>${d.title}</b><br>
    <small>Cliques: ${d.clicks}</small><br>
    <a href="concluir.html?id=${c.key}" target="_blank">Abrir</a><br>
    <button onclick="editar('${c.key}')">Editar</button>
    <button onclick="remover('${c.key}')">Remover</button>
   </div>
  `;
 });
});

window.remover=async id=>{
 await remove(dbRef(db,"links/"+id));
};

window.editar=async id=>{
 const t=prompt("Novo título:");
 if(t)await update(dbRef(db,"links/"+id),{title:t});
};
</script>
</body>
</html>
