<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Vortex • Painel</title>

<style>
body{margin:0;background:#0d1117;color:#fff;font-family:Arial}
.box{max-width:900px;margin:40px auto;padding:20px}
.card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:20px;margin-bottom:20px}
input,button{width:100%;padding:10px;margin:6px 0;border-radius:6px;border:1px solid #30363d;background:#0d1117;color:#fff}
button{background:#238636;border:none;font-weight:bold;cursor:pointer}
button:hover{background:#2ea043}
.link{border:1px solid #30363d;padding:10px;border-radius:6px;margin-top:10px}
a{color:#58a6ff;text-decoration:none}
small{color:#8b949e}
</style>
</head>

<body>
<div class="box">

<div class="card">
<h2>Gerar Link</h2>
<input id="title" placeholder="Título">
<input id="file" type="file">
<input id="photo" type="file" accept="image/*">
<button onclick="gerar()">Gerar</button>
</div>

<div class="card">
<h2>Links Gerados</h2>
<div id="lista"></div>
</div>

</div>

<script type="module" src="./index.js"></script>
</body>
</html>
