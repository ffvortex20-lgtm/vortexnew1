<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Gerador</title>
    <style>
        body { background-color: #0b0e14; color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #161b22; padding: 30px; border-radius: 12px; border: 1px solid #30363d; width: 450px; }
        h2 { text-align: center; color: #58a6ff; margin-bottom: 20px; }
        label { font-size: 12px; color: #8b949e; display: block; margin-top: 10px; }
        input { width: 100%; padding: 12px; margin-top: 5px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 15px; margin-top: 20px; border-radius: 6px; border: none; background: #238636; color: white; font-weight: bold; cursor: pointer; }
        #resultado { margin-top: 20px; display: none; padding: 15px; background: #0d1117; border: 1px dashed #58a6ff; border-radius: 6px; }
        #linkFinal { color: #58a6ff; font-size: 13px; word-break: break-all; margin: 10px 0; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Gerar Link Único</h2>
        
        <label>Título da Versão</label>
        <input type="text" id="tit" placeholder="Ex: Delta V702">
        <label>Nome do Arquivo</label>
        <input type="text" id="nom" placeholder="Ex: delta.apk">
        <label>Tamanho</label>
        <input type="text" id="tam" placeholder="Ex: 150 MB">
        
        <label>Link de Download (Mediafire, Drive, etc)</label>
        <input type="text" id="l_d" placeholder="Cole o link aqui">
        
        <label>Link do Botão Vermelho (YouTube, WhatsApp, etc)</label>
        <input type="text" id="l_c" placeholder="https://wa.me/seu_numero ou Canal">
        
        <label>Link do Vídeo (Apenas o ID ou link do YT)</label>
        <input type="text" id="l_v" placeholder="Link do vídeo para o player">

        <button onclick="gerarLinkCurto()">GERAR LINK COMPATÍVEL</button>

        <div id="resultado">
            <label>Link pronto para uso:</label>
            <strong id="linkFinal"></strong>
            <button onclick="copiarLink()" style="background: #1f6feb;">COPIAR LINK</button>
        </div>
    </div>

    <script>
        async function gerarLinkCurto() {
            let urlAtual = window.location.href.split('?')[0];
            let pastaBase = urlAtual.substring(0, urlAtual.lastIndexOf('/') + 1);
            let linkConcluir = pastaBase + "concluir.html";

            // Função que limpa e valida qualquer link (YT, WA, Drive)
            const limparUrl = (u) => {
                let url = u.trim();
                if (!url.startsWith('http')) url = 'https://' + url;
                return encodeURIComponent(url);
            };

            // Extrair ID do vídeo com segurança
            let vInput = document.getElementById('l_v').value;
            let vID = vInput.includes('v=') ? vInput.split('v=')[1].split('&')[0] : vInput.split('/').pop();

            const params = `?t=${encodeURIComponent(document.getElementById('tit').value)}` +
                           `&n=${encodeURIComponent(document.getElementById('nom').value)}` +
                           `&s=${encodeURIComponent(document.getElementById('tam').value)}` +
                           `&d=${limparUrl(document.getElementById('l_d').value)}` +
                           `&c=${limparUrl(document.getElementById('l_c').value)}` +
                           `&v=${vID}`;

            const linkLongo = linkConcluir + params;
            
            try {
                const res = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(linkLongo)}`);
                const linkCurto = await res.text();
                document.getElementById('linkFinal').innerText = linkCurto;
                document.getElementById('resultado').style.display = 'block';
            } catch (err) {
                document.getElementById('linkFinal').innerText = linkLongo;
                document.getElementById('resultado').style.display = 'block';
            }
        }

        function copiarLink() {
            navigator.clipboard.writeText(document.getElementById('linkFinal').innerText);
            alert("Link copiado!");
        }
    </script>
</body>
</html>
